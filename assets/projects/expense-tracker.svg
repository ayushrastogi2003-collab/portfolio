<svg width="600" height="340" viewBox="0 0 600 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="600" height="340" fill="#091319"/>

  <!-- Subtle Grid -->
  <g opacity="0.15">
    <line x1="0" y1="60" x2="600" y2="60" stroke="#10b981" stroke-width="1"/>
    <line x1="0" y1="120" x2="600" y2="120" stroke="#10b981" stroke-width="1"/>
    <line x1="0" y1="180" x2="600" y2="180" stroke="#10b981" stroke-width="1"/>
    <line x1="0" y1="240" x2="600" y2="240" stroke="#10b981" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="340" stroke="#10b981" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="340" stroke="#10b981" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="340" stroke="#10b981" stroke-width="1"/>
  </g>

  <!-- Phone Frame Mockup -->
  <g transform="translate(225, 20)">
    <rect x="0" y="0" width="150" height="270" rx="20" fill="#13271e" stroke="#10b981" stroke-width="2.5"/>
    <!-- Phone Screen -->
    <rect x="6" y="10" width="138" height="250" rx="14" fill="#061a12"/>
    <!-- Notch -->
    <rect x="45" y="14" width="60" height="4" rx="2" fill="#2d5a45"/>
    
    <!-- Balance Card -->
    <rect x="14" y="26" width="122" height="50" rx="8" fill="url(#walletGrad)"/>
    <text x="24" y="42" fill="#d1fae5" font-family="'Inter', sans-serif" font-size="8" font-weight="500">Total Balance</text>
    <text x="24" y="62" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="700">₹24,850.00</text>

    <!-- Mini Analytics Bar -->
    <rect x="14" y="86" width="122" height="34" rx="6" fill="#13271e" stroke="#10b981" stroke-opacity="0.3"/>
    <rect x="24" y="94" width="16" height="18" rx="2" fill="#10b981"/>
    <rect x="45" y="100" width="16" height="12" rx="2" fill="#34d399"/>
    <rect x="66" y="92" width="16" height="20" rx="2" fill="#10b981"/>
    <rect x="87" y="97" width="16" height="15" rx="2" fill="#6ee7b7"/>
    <rect x="108" y="90" width="16" height="22" rx="2" fill="#059669"/>

    <!-- Expense List Rows -->
    <rect x="14" y="128" width="122" height="26" rx="6" fill="#13271e"/>
    <circle cx="26" cy="141" r="6" fill="#ef4444" opacity="0.8"/>
    <rect x="38" y="138" width="40" height="5" rx="2" fill="#e2e8f0"/>
    <text x="126" y="144" text-anchor="end" fill="#f87171" font-family="'Inter', sans-serif" font-size="9" font-weight="600">-₹450</text>

    <rect x="14" y="160" width="122" height="26" rx="6" fill="#13271e"/>
    <circle cx="26" cy="173" r="6" fill="#10b981" opacity="0.8"/>
    <rect x="38" y="170" width="35" height="5" rx="2" fill="#e2e8f0"/>
    <text x="126" y="176" text-anchor="end" fill="#34d399" font-family="'Inter', sans-serif" font-size="9" font-weight="600">+₹2,000</text>

    <rect x="14" y="192" width="122" height="26" rx="6" fill="#13271e"/>
    <circle cx="26" cy="205" r="6" fill="#ef4444" opacity="0.8"/>
    <rect x="38" y="202" width="45" height="5" rx="2" fill="#e2e8f0"/>
    <text x="126" y="208" text-anchor="end" fill="#f87171" font-family="'Inter', sans-serif" font-size="9" font-weight="600">-₹120</text>

    <!-- Bottom Nav -->
    <rect x="14" y="234" width="122" height="20" rx="4" fill="#13271e"/>
    <circle cx="40" cy="244" r="3" fill="#10b981"/>
    <circle cx="75" cy="244" r="3" fill="#475569"/>
    <circle cx="110" cy="244" r="3" fill="#475569"/>
  </g>

  <!-- Left Floating Badge -->
  <g transform="translate(45, 100)">
    <rect width="140" height="48" rx="10" fill="rgba(6, 26, 18, 0.9)" stroke="#10b981" stroke-width="1.2"/>
    <text x="70" y="22" text-anchor="middle" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">FLUTTER &amp; DART</text>
    <text x="70" y="38" text-anchor="middle" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="10">Expense Tracker</text>
  </g>

  <!-- Right Floating Badge -->
  <g transform="translate(415, 150)">
    <rect width="140" height="48" rx="10" fill="rgba(6, 26, 18, 0.9)" stroke="#34d399" stroke-width="1.2"/>
    <text x="70" y="22" text-anchor="middle" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="11" font-weight="700">STATE MGMT</text>
    <text x="70" y="38" text-anchor="middle" fill="#a7f3d0" font-family="'JetBrains Mono', monospace" font-size="10">Clean Codebase</text>
  </g>

  <!-- Bottom Tag -->
  <rect x="175" y="295" width="250" height="32" rx="16" fill="rgba(6, 26, 18, 0.9)" stroke="#10b981" stroke-width="1"/>
  <text x="300" y="315" text-anchor="middle" fill="#d1fae5" font-family="'Inter', sans-serif" font-size="11" font-weight="600">
    EXPENSE TRACKER APP PREVIEW
  </text>
</svg>