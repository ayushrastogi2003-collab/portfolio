<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="396" height="396" rx="30" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="10 8" opacity="0.8"/>

  <!-- Avatar Placeholder Silhouette -->
  <circle cx="200" cy="150" r="60" fill="url(#ringGrad)" opacity="0.35"/>
  <path d="M120 280 C120 230, 160 215, 200 215 C240 215, 280 230, 280 280 C280 300, 260 310, 200 310 C140 310, 120 300, 120 280 Z" fill="url(#ringGrad)" opacity="0.35"/>

  <!-- Camera / Add Photo Icon -->
  <circle cx="200" cy="180" r="32" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
  <path d="M188 186 C188 184 190 182 192 182 L195 178 L205 178 L208 182 L212 182 C214 182 216 184 216 186 L216 194 C216 196 214 198 212 198 L188 198 C186 198 184 196 184 194 Z" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <circle cx="200" cy="190" r="4" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- Label -->
  <rect x="90" y="325" width="220" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="200" y="348" text-anchor="middle" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
    PHOTO PLACEHOLDER
  </text>
  <text x="200" y="380" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">
    assets/profile.jpg
  </text>
</svg>
